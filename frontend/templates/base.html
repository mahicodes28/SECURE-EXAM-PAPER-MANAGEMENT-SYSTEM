<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secure Exam Paper Management System{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom Theme CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="{{ url_for('page.index') }}">
                <i class="bi bi-shield-lock-fill text-warning fs-4"></i>
                <span>ExamChain</span>
                <span class="badge-blockchain">Ethereum</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('page.verify_page') }}">
                            <i class="bi bi-patch-check"></i> Verify Integrity
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('page.blockchain_explorer') }}">
                            <i class="bi bi-diagram-3"></i> Explorer
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <button id="connect-wallet-btn" class="btn btn-outline-light btn-sm" onclick="connectMetaMask()">
                        <i class="bi bi-wallet2"></i> Connect Wallet
                    </button>
                    {% if current_user.is_authenticated %}
                        <div class="dropdown">
                            <button class="btn btn-outline-warning btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle"></i> {{ current_user.name }}
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow">
                                <li>
                                    <span class="dropdown-item-text text-muted small">
                                        Role: <strong>{{ current_user.role|capitalize }}</strong>
                                    </span>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <a class="dropdown-item" href="{{ url_for('page.profile') }}">
                                        <i class="bi bi-gear"></i> Settings
                                    </a>
                                </li>
                                <li>
                                    <button class="dropdown-item text-danger" onclick="logoutUser()">
                                        <i class="bi bi-box-arrow-right"></i> Logout
                                    </button>
                                </li>
                            </ul>
                        </div>
                    {% else %}
                        <a href="{{ url_for('page.login_page') }}" class="btn btn-outline-light btn-sm">Login</a>
                        <a href="{{ url_for('page.register_page') }}" class="btn btn-gold btn-sm">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notification Container -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
        <div id="liveToast" class="toast align-items-center text-white bg-dark border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Notification</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Application JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        async function logoutUser() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = "{{ url_for('page.login_page') }}";
            } catch (err) {
                console.error(err);
                window.location.href = "{{ url_for('page.login_page') }}";
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
