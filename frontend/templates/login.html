{% extends "base.html" %}

{% block title %}Sign In — Secure Exam System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-3 mt-4">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
                        <h4 class="fw-bold mt-2">Sign In</h4>
                        <p class="text-muted small">Access Examination Management Portal</p>
                    </div>

                    <div id="login-alert" class="alert alert-danger d-none"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="name@university.edu" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2">Sign In</button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted small">New Faculty?</span>
                        <a href="{{ url_for('page.register_page') }}" class="small fw-semibold text-decoration-none">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('login-alert');
    alertBox.classList.add('d-none');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
            if (data.user.role === 'admin') {
                window.location.href = "{{ url_for('page.admin_dashboard') }}";
            } else {
                window.location.href = "{{ url_for('page.faculty_dashboard') }}";
            }
        } else {
            alertBox.innerText = data.error || 'Login failed';
            alertBox.classList.remove('d-none');
        }
    } catch (err) {
        alertBox.innerText = 'Unable to connect to server';
        alertBox.classList.remove('d-none');
    }
});
</script>
{% endblock %}
